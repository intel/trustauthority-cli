name: OnMergeRelease

on:
  push:
    branches:
      - 'main'
      - 'release/*'
    tags:
      - '**'

permissions: read-all

jobs:
  build-test:
    runs-on: [ "innersource.prod.amr.dind" ]
    env:
      http_proxy: ${{ secrets.HTTP_PROXY }}
      https_proxy: ${{ secrets.HTTPS_PROXY }}
      no_proxy: ${{ secrets.NO_PROXY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
        with:
          go-version: '1.23.8'

      - name: Setup build-essential
        run: sudo -E apt update && sudo -E apt install build-essential makeself  -y

      - name: Style Checker
        run: |
          if [ $(make go-fmt | tail -n 1 | grep gofmt | wc -l)  -eq 0 ]; then
             exit 0
          fi

      - name: Unit Test Coverage
        run: |
          make test-coverage
          COVERAGE=$(make test-coverage | grep 'total' | awk '{print $3}' | awk -F. '{print $1}')
          echo "Unit test coverage is - $COVERAGE%"
          if [[ $COVERAGE -lt 75 ]]; then
            echo "Unit test coverage must be above 75% "
            exit 1
          fi

  artifact-installer:
    runs-on: [ "innersource.prod.amr.dind" ]
    needs: ["build-test"]
    env:
      http_proxy: ${{ secrets.HTTP_PROXY }}
      https_proxy: ${{ secrets.HTTPS_PROXY }}
      no_proxy: ${{ secrets.NO_PROXY }}
      ARTIFACTORY: ${{ secrets.ARTIFACTORY }}
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup build-essential
        run: sudo -E apt update && sudo -E apt install build-essential make  -y

      - name: Push Installer
        run: make push-artifact

  cleanup-images-bins:
    runs-on: [ "innersource.prod.amr.dind" ]
    needs: [ "build-test", "artifact-installer" ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup build-essential
        run: sudo -E apt update && sudo -E apt install build-essential makeself make -y

      - name: Clean generated binaries.
        run: make clean
