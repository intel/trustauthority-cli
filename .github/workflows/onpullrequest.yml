name: OnPullRequest

on:
  pull_request:


permissions: read-all

jobs:

 version-check:
    runs-on: [ "innersource.prod.amr.dind" ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup build-essential
        run: sudo -E apt update && sudo -E apt install build-essential -y

      - name: version-check
        run: |
          /bin/bash version-check.sh
          if [[ $? -eq 1 ]]; then
            echo "version check failed"
            exit 1
          fi

 security-file-check:
    runs-on: [ "innersource.prod.amr.dind" ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup build-essential
        run: sudo -E apt update && sudo -E apt install build-essential -y

      - name: Check Security.md file
        run: |
          if [ ! -f ./Security.md ]; then
            echo "Security.md file is missing"
            exit 1
          fi
          
 build-test:
    runs-on: [ "innersource.prod.amr.dind" ]
    needs: [ "version-check" ]
    env:
      http_proxy: ${{ secrets.HTTP_PROXY }}
      https_proxy: ${{ secrets.HTTPS_PROXY }}
      no_proxy: ${{ secrets.NO_PROXY }}
    steps:
      - uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
        with:
          go-version: '1.23.8'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup build-essential
        run: sudo -E apt update && sudo -E apt install build-essential makeself -y

      - name: Style Checker
        run: |
          if [ $(make go-fmt | tail -n 1 | grep gofmt | wc -l)  -eq 0 ]; then
             exit 0
          fi

      - name: Unit Test Coverage
        run: |
          make test-coverage
          COVERAGE=$(make test-coverage | grep 'total' | awk '{print $3}' | awk -F. '{print $1}')
          echo "Unit test coverage is - $COVERAGE%"
          if [[ $COVERAGE -lt 80 ]]; then
            echo "Unit test coverage must be above 80% "
            exit 1
          fi

      - name: Build Installer
        run: make installer


 cleanup-images-bins:
   runs-on: [ "innersource.prod.amr.dind" ]
   needs: [ "build-test" ]
   steps:
     - uses: actions/checkout@v4
       with:
         fetch-depth: 0
     - name: Setup build-essential
       run: sudo -E apt update && sudo -E apt install build-essential makeself make -y

     - name: Clean generated binaries.
       run: make clean
